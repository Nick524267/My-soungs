<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astronaut in the Ocean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f1a;
            overflow: hidden;
            color: #fff;
            transition: all 0.3s ease;
        }

        /* Анимированный градиентный фон */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1a3e 40%, #0d1b2a 70%, #000 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Звёзды на фоне */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Основная карточка */
        .card {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 35px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: all 0.4s ease;
            cursor: pointer; /* Курсор в виде руки, чтобы намекнуть на клик */
        }

        /* Увеличение карточки в полноэкранном режиме */
        :fullscreen .card {
            max-width: 600px;
            padding: 50px 40px;
            border-radius: 40px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Обложка */
        .cover {
            width: 220px;
            height: 220px;
            border-radius: 24px;
            object-fit: cover;
            margin: 0 auto 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: block;
            transition: transform 0.4s ease;
            pointer-events: none; /* Чтобы клики проходили на карточку */
        }
        :fullscreen .cover {
            width: 300px;
            height: 300px;
        }

        /* Текст */
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            pointer-events: none;
        }
        :fullscreen h1 { font-size: 2rem; }

        .artist {
            font-size: 1.05rem;
            color: #a0aec0;
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* Подсказка "Нажмите" */
        .hint {
            font-size: 0.8rem;
            color: #93c5fd;
            margin-top: 15px;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        /* Скрываем подсказку в полноэкранном режиме */
        :fullscreen .hint { display: none; }

        /* Аудиоплеер */
        audio {
            width: 100%;
            height: 50px;
            outline: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        
        /* Адаптив */
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .cover { width: 180px; height: 180px; }
            :fullscreen .cover { width: 220px; height: 220px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="stars" id="stars"></div>

    <div class="card" id="mainCard">
        <img src="https://i.discogs.com/5R-oq3TIGcORe074z72WtHIKTukRglruK_86wlSyhag/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE3NjAx/ODI2LTE2NDI3ODky/NTMtOTE5Ni5qcGVn.jpeg" alt="Cover" class="cover">

        <h1>Astronaut in the Ocean</h1>
        <p class="artist">Masked Wolf</p>

        <!-- Плеер (музыка) -->
        <audio id="myAudio" controls loop>
            <source src="song.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоплеер.
        </audio>

        <p class="hint">Нажми на экран для полного погружения</p>
    </div>

    <script>
        // Генерация звезд
        const starsContainer = document.getElementById('stars');
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }

        // Функция для включения полного экрана и запуска музыки
        function engageExperience() {
            // 1. Включаем полноэкранный режим
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log("Ошибка полного экрана:", err);
                    });
                } else if (document.documentElement.webkitRequestFullscreen) { /* Для Safari */
                    document.documentElement.webkitRequestFullscreen();
                }
            }
            
            // 2. Запускаем музыку (если браузер заблокировал автоплей)
            const audio = document.getElementById('myAudio');
            if (audio.paused) {
                audio.play().catch(e => console.log("Автоплей заблокирован"));
            }

            // Убираем обработчики после первого клика
            document.removeEventListener('click', engageExperience);
            document.removeEventListener('touchstart', engageExperience);
        }

        // Вешаем событие на ЛЮБОЕ действие пользователя (клик или тап на телефоне)
        document.addEventListener('click', engageExperience);
        document.addEventListener('touchstart', engageExperience);
        
        // Запрещаем масштабирование страницы пальцами (чтобы не ломать дизайн)
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
