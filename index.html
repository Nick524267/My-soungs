<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut in the Ocean — Masked Wolf</title>
    <style>
        /* Базовые настройки: запрет прокрутки и центрирование */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f1a;
            overflow: hidden; /* Убираем прокрутку */
            color: #fff;
        }

        /* Анимированный градиентный фон */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1a3e 40%, #0d1b2a 70%, #000 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Звёзды на фоне */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Основная карточка */
        .card {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 35px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Обложка из скриншота */
        .cover {
            width: 220px;
            height: 220px;
            border-radius: 24px;
            object-fit: cover;
            margin: 0 auto 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: block;
            transition: transform 0.4s ease;
        }
        .cover:hover { transform: scale(1.04) rotate(-1deg); }

        /* Текст */
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .artist {
            font-size: 1.05rem;
            color: #a0aec0;
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Скрываем стандартный вид аудиоплеера и стилизуем его */
        audio {
            width: 100%;
            height: 50px;
            outline: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        /* Стилизация для Webkit (Chrome, Safari, Edge) */
        audio::-webkit-media-controls-panel {
            background-color: rgba(255, 255, 255, 0.1);
        }
        audio::-webkit-media-controls-play-button {
            background-color: #fff;
            border-radius: 50%;
        }
        
        /* Адаптив для маленьких экранов */
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .cover { width: 180px; height: 180px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Фон -->
    <div class="bg-gradient"></div>
    <div class="stars" id="stars"></div>

    <!-- Карточка с контентом -->
    <div class="card">
        <!-- Твоя обложка со скриншота -->
        <img 
            src="https://i.discogs.com/5R-oq3TIGcORe074z72WtHIKTukRglruK_86wlSyhag/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE3NjAx/ODI2LTE2NDI3ODky/NTMtOTE5Ni5qcGVn.jpeg" 
            alt="Astronaut in the Ocean Cover" 
            class="cover"
        >

        <h1>Astronaut in the Ocean</h1>
        <p class="artist">Masked Wolf</p>

        <!-- Аудиоплеер с полной версией трека -->
        <!-- Внимание: если ссылка перестанет работать, её можно заменить на любую другую прямую ссылку на MP3 -->
        <audio controls autoplay loop>
            <source src="https://soundloud.net/11374/stream" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоплеер.
        </audio>
    </div>

    <script>
        // Генерация звёзд на фоне
        const starsContainer = document.getElementById('stars');
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
