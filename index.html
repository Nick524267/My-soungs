<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astronaut in the Ocean</title>
    <style>
        /* Сброс отступов */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            /* Убираем синее выделение при тапе на телефонах */
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Запрещаем выделять текст */
            -webkit-user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f1a;
            overflow: hidden;
            color: #fff;
        }

        /* Анимированный градиентный фон */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1a3e 40%, #0d1b2a 70%, #000 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Звёзды */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Кнопка полноэкранного режима (СЛЕВА СВЕРХУ) */
        .fullscreen-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.15s ease; /* Плавная анимация */
            backdrop-filter: blur(10px);
            outline: none; /* Убираем рамку фокуса */
        }
        
        /* Эффект при нажатии (посветление и уменьшение) */
        .fullscreen-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.85);
        }

        /* Основная карточка */
        .card {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 35px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: all 0.4s ease;
        }

        :fullscreen .card {
            max-width: 600px;
            padding: 50px 40px;
            border-radius: 40px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Обложка */
        .cover {
            width: 220px;
            height: 220px;
            border-radius: 24px;
            object-fit: cover;
            margin: 0 auto 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: block;
            transition: transform 0.4s ease;
            pointer-events: none; /* Чтобы клики не выделяли картинку */
        }
        :fullscreen .cover {
            width: 300px;
            height: 300px;
        }

        /* Текст */
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        :fullscreen h1 { font-size: 2rem; }

        .artist {
            font-size: 1.05rem;
            color: #a0aec0;
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Аудиоплеер */
        audio {
            width: 100%;
            height: 50px;
            outline: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .cover { width: 180px; height: 180px; }
            :fullscreen .cover { width: 220px; height: 220px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Кнопка на весь экран (Слева сверху) -->
    <button class="fullscreen-btn" id="fsBtn" title="На весь экран">⛶</button>

    <div class="bg-gradient"></div>
    <div class="stars" id="stars"></div>

    <div class="card" id="mainCard">
        <img src="https://i.discogs.com/5R-oq3TIGcORe074z72WtHIKTukRglruK_86wlSyhag/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE3NjAx/ODI2LTE2NDI3ODky/NTMtOTE5Ni5qcGVn.jpeg" alt="Cover" class="cover">

        <h1>Astronaut in the Ocean</h1>
        <p class="artist">Masked Wolf</p>

        <!-- Плеер (song.mp3) -->
        <audio id="myAudio" controls loop>
            <source src="song.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоплеер.
        </audio>
    </div>

    <script>
        // Генерация звезд
        const starsContainer = document.getElementById('stars');
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }

        const fsBtn = document.getElementById('fsBtn');
        const audio = document.getElementById('myAudio');

        // Функция для переключения полноэкранного режима
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(e => console.log(e));
                } else if (document.documentElement.webkitRequestFullscreen) { 
                    document.documentElement.webkitRequestFullscreen();
                }
                fsBtn.innerHTML = '✕'; 
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { 
                    document.webkitExitFullscreen();
                }
                fsBtn.innerHTML = '⛶'; 
            }
        }

        // 1. Работа кнопки
        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            toggleFullScreen();
        });

        // 2. Включение при клике в любом месте страницы
        document.addEventListener('click', (e) => {
            // Если кликнули по плееру — не трогаем
            if (e.target.tagName === 'AUDIO' || e.target.closest('audio')) {
                return; 
            }
            
            // Включаем полный экран, если еще не включен
            if (!document.fullscreenElement) {
                toggleFullScreen();
            }

            // Пробуем запустить музыку
            if (audio.paused) {
                audio.play().catch(err => console.log("Звук заблокирован", err));
            }
        });
    </script>

</body>
</html>
