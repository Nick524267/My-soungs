<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut in the Ocean — Masked Wolf</title>
    <meta name="description" content="Слушайте Astronaut in the Ocean от Masked Wolf. Официальный плеер и информация о треке.">
    <style>
        /* Базовые настройки */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f1a;
            overflow-x: hidden;
            color: #fff;
            padding: 20px;
        }

        /* Анимированный градиентный фон */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1a3e 40%, #0d1b2a 70%, #000 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Звёзды на фоне */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Основная карточка */
        .card {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 35px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Обложка */
        .cover {
            width: 200px;
            height: 200px;
            border-radius: 24px;
            object-fit: cover;
            margin: 0 auto 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: block;
            transition: transform 0.4s ease;
        }
        .cover:hover { transform: scale(1.04) rotate(-1deg); }

        /* Текст */
        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .artist {
            font-size: 1.05rem;
            color: #a0aec0;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Плеер */
        .player-wrapper {
            margin-bottom: 20px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Описание */
        .description {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e0;
            margin-bottom: 22px;
            padding: 0 8px;
        }
        .description strong { color: #93c5fd; }

        /* Ссылки */
        .links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            background: rgba(255,255,255,0.08);
        }
        .btn:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn-tiktok { background: rgba(254, 44, 85, 0.2); border-color: rgba(254, 44, 85, 0.4); }
        .btn-tiktok:hover { background: rgba(254, 44, 85, 0.35); }

        /* Адаптив */
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .cover { width: 160px; height: 160px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Фон -->
    <div class="bg-gradient"></div>
    <div class="stars" id="stars"></div>

    <!-- Карточка с контентом -->
    <div class="card">
        <!-- Обложка -->
        <img 
            src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=600&q=80" 
            alt="Astronaut in the Ocean Cover" 
            class="cover"
        >

        <h1>Astronaut in the Ocean</h1>
        <p class="artist">Masked Wolf</p>

        <!-- Плеер Spotify (официальный трек) -->
        <div class="player-wrapper">
            <iframe 
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/track/6E90gq0KO6FYZVOXx8kCcC?utm_source=generator&theme=0" 
                width="100%" 
                height="152" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>

        <p class="description">
            Трек о борьбе с <strong>депрессией и тревогой</strong>, который стал вирусным в TikTok. 
            Слушайте официальную версию прямо здесь.
        </p>

        <!-- Ссылки -->
        <div class="links">
            <!-- ЗАМЕНИ @ВАШ_ПРОФИЛЬ НА СВОЙ НИКНЕЙМ -->
            <a href="https://www.tiktok.com/@ВАШ_ПРОФИЛЬ" target="_blank" class="btn btn-tiktok">
                🎵 Мой TikTok
            </a>
            <a href="https://open.spotify.com/track/6E90gq0KO6FYZVOXx8kCcC" target="_blank" class="btn">
                💚 Spotify
            </a>
        </div>
    </div>

    <script>
        // Генерация звёзд на фоне
        const starsContainer = document.getElementById('stars');
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
